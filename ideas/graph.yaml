version: 1
project: TokenMonitor
overview: >
  一个本地优先的系统托盘应用（Tauri v2 + Svelte 5 + Rust），把 Claude Code、Codex CLI
  和 Cursor IDE 写在磁盘上的会话日志读成"我这段时间花了多少钱、还剩多少额度"。
  数据流是：本地 JSONL → Rust 解析器 → 定价 → 内存/磁盘缓存 → Tauri IPC → Svelte store
  → 托盘弹窗 + 悬浮球。没有账号、没有云同步、没有遥测；每一个会读的路径都在 paths.rs 注册
  并在设置里向用户披露。跨 macOS / Windows / Linux 三平台，打 tag 由 CI 产出签名安装包并
  通过 tauri-plugin-updater 自动更新。当前版本 0.14.2。

endpoints: [I-044, I-045]

ideas:
  # ── 基础：读什么、怎么读、怎么算钱 ──────────────────────────────

  - id: I-001
    name: "会话日志路径注册表"
    status: done
    needs: []
    what: >
      把应用会读的每一个文件系统位置集中登记在一个模块里，并能把这份清单枚举出来给 UI。
    why: >
      "本地优先、不上传"是这个项目的核心承诺，而承诺只有可核对才算数。路径常量散落在
      各个解析器里时，"我们到底读了你哪些文件"这个问题没人答得上来。
    expected: >
      新增任何读取位置都必须在 paths.rs 出现；accessed_paths() 返回的结构体清单能直接
      渲染成设置页里的隐私披露面板，用户看到的路径和代码真正读的路径是同一份。
    how: >
      每一类位置一个函数（Claude projects 目录、Codex sessions、Cursor state.vscdb、
      statusline 事件文件、归档根目录、日志目录…），accessed_paths() 把它们汇总成带
      用途说明的 AccessedPath 列表。
    why_this_way: >
      AGENTS.md 把它写成了硬规则："Every filesystem location the app reads must be
      registered in src-tauri/src/paths.rs"。集中注册是让隐私声明可审计的最便宜做法。
    code:
      - file: src-tauri/src/paths.rs
        symbol: accessed_paths
        lines: "161-200"
    verify:
      command: "TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path src-tauri/Cargo.toml --lib paths::tests"
      pass: "exit 0"
    future: >
      可以据此生成沙箱白名单、"打开数据目录"入口，或在出问题时一键导出"我读了哪些文件"的诊断包。

  - id: I-002
    name: "模型名归一化与家族识别"
    status: done
    needs: []
    what: >
      把各家日志里五花八门的模型标识（claude-sonnet-4-5-20250929、Bedrock ID、
      gpt-5.1-codex-max、composer-1…）压成一个稳定的 model_key 和一个人类可读的显示名。
    why: >
      不归一化的话，同一个模型会在图表和分解列表里裂成好几行，成本也就没法比较；而定价表、
      配色、隐藏模型设置全都以 model_key 为主键。
    expected: >
      同一模型的所有别名映射到同一个 key；未知的未来型号保留自己的身份而不是被吞成
      "unknown"；models.rs 里约一百个单元测试逐个钉住这些映射。
    how: >
      detect_model_family 先判家族，再由 normalize_claude_model /
      normalize_codex_model / normalize_generic_model 产出 (key, display_name)。
    why_this_way: >
      测试名本身就是规格（claude_unknown_future_family_keeps_identity、
      claude_sonnet_4_5_not_generic_sonnet），说明"未知型号保留身份、精确版本不退化成
      泛型家族"是刻意选择，而不是实现副作用。
    code:
      - file: src-tauri/src/models.rs
        symbol: detect_model_family
        lines: "227-409"
      - file: src-tauri/src/models.rs
        symbol: normalize_claude_model
        lines: "410-457"
      - file: src-tauri/src/models.rs
        symbol: normalize_codex_model
        lines: "458-496"
    verify:
      command: "TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path src-tauri/Cargo.toml --lib models::tests"
      pass: "exit 0"
    future: >
      新供应商接入时只要补一条家族规则，图表配色、隐藏模型、定价查找会自动跟上。

  - id: I-003
    name: "本地会话日志解析"
    status: done
    needs: [I-001, I-002]
    what: >
      把 Claude Code 和 Codex CLI 的 JSONL 会话日志读成统一的 ParsedEntry
      （时间、模型、各类 token、会话 id、项目路径）。
    why: >
      这是所有数字的源头。没有它，"今天花了多少"就只能靠猜或者靠供应商的后台页面。
    expected: >
      同一份日志重复解析得到同样的 token 数；同一条 message/request id 只计一次；
      Codex 的 reasoning token 通过 billed_output_tokens 启发式扣除，不会把思考
      token 重复计费。
    how: >
      六阶段并行流水线（列目录 → 增量筛文件 → rayon 并行读 → 逐行反序列化 → 去重 →
      合并），claude_parser 与 codex_parser 各自处理自家 schema。
    why_this_way: >
      README 与 AGENTS.md 把"parses JSONL session logs from disk"列为架构前提：直接读
      本地日志而不是调供应商 API，才能做到无账号、无网络、无遥测，也才能在离线时仍然有数。
    code:
      - file: src-tauri/src/usage/parser.rs
        symbol: UsageParser::load_integration_entries_with_debug
        lines: "1258-1743"
      - file: src-tauri/src/usage/claude_parser.rs
      - file: src-tauri/src/usage/codex_parser.rs
    verify:
      command: "TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path src-tauri/Cargo.toml --lib usage::parser::tests"
      pass: "exit 0"
    future: >
      新的 CLI 只要写一个 parser 模块并注册成 UsageIntegration，就能复用后面全部的定价、
      缓存、归档、图表链路。

  - id: I-004
    name: "令牌定价与成本计算"
    status: done
    needs: [I-002]
    what: >
      一张静态定价表，把 (模型, 输入/输出/5m 缓存写/1h 缓存写/缓存读) 换算成美元。
    why: >
      token 数对人没有意义，钱才有。而且这是唯一一处必须"和账单对得上"的计算。
    expected: >
      已知模型的每类 token 单价与官方一致；1h 缓存写有上限保护；未知家族返回 0 成本
      并标记 pricing_available=false，UI 显示 "N/A" 而不是假装免费。
    how: >
      pricing.rs 的静态表 + calculate_cost / calculate_cost_for_key；改表时必须
      同步 bump PRICING_VERSION。
    why_this_way: >
      AGENTS.md 明确要求"bump PRICING_VERSION when editing"，而 usage_query.rs 直接把
      PRICING_VERSION 当作 payload 缓存键的一部分——定价一变，所有缓存自动失效。用版本号
      而不是手动清缓存，是为了杜绝"改了价钱但界面还显示旧金额"这一类静默错误。
    code:
      - file: src-tauri/src/usage/pricing.rs
        symbol: PRICING_VERSION
        lines: "2"
      - file: src-tauri/src/usage/pricing.rs
        symbol: calculate_cost
        lines: "60-86"
      - file: src-tauri/src/commands/usage_query.rs
        symbol: USAGE_PAYLOAD_CACHE_VERSION
        lines: "23"
    verify:
      command: "TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path src-tauri/Cargo.toml --lib usage::pricing::tests"
      pass: "exit 0"
    future: >
      同一套换算可以驱动预算告警、月度"赚回来了多少"的对比，以及导出给财务的报表。

  - id: I-005
    name: "未知模型的动态定价兜底"
    status: done
    needs: [I-004]
