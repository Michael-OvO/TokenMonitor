  - id: I-008
    name: "增量缓存与冷启动加速"
    status: done
    needs: [I-003]
    what: >
      三层缓存（payload / 文件条目 / 目录清单）加上一次基于 mtime+size 的变更扫描，
      让"日志没变"的情况完全不重新解析。
    why: >
      一台用了几个月的机器有上万个 JSONL 文件。每次刷新都全量重解析，托盘应用就会变成
      一个持续吃 CPU 的东西。
    expected: >
      日志无变化时刷新不产生解析工作；只有被追加的文件会被重读；缓存条目会按上限被
      prune 掉，内存不无限增长。
    how: >
      scan_source_changes 比对 mtime/size 得出变更集，invalidate_if_changed 只失效
      受影响的键，apply_content_changes 增量合并；payload_disk_cache 让重启后仍是热的；
      cache_warmup 可以后台预热所有 provider×period 组合。
    why_this_way: null
    code:
      - file: src-tauri/src/usage/parser.rs
        symbol: UsageParser::scan_source_changes
        lines: "1008-1091"
      - file: src-tauri/src/usage/parser.rs
        symbol: UsageParser::invalidate_if_changed
        lines: "1092-1123"
      - file: src-tauri/src/usage/cache_warmup.rs
        symbol: warmup_payloads
        lines: "99-207"
    verify:
      command: "TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path src-tauri/Cargo.toml --lib invalidate_if_changed_detects_append_to_existing_jsonl"
      pass: "exit 0"
    future: >
      有了可靠的变更信号，才敢做文件监听驱动的实时刷新，而不是定时轮询。

  - id: I-009
