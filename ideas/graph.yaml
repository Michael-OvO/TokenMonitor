      静态表里查不到的模型，去 LiteLLM / OpenRouter 拉一次价格，带 24 小时 TTL 缓存。
    why: >
      新模型的发布节奏比这个 app 的发版节奏快。没有兜底的话，用户升级 CLI 当天就会看到
      一堆 $0.00。
    expected: >
      静态表命中时不发任何网络请求；未命中时拉取一次并缓存 24h；两边都拿不到就退回
      pricing_fallback.json，再不行才是 0 + pricing_available=false。
    how: >
      pricing.rs 查询顺序为 dynamic → fallback → hardcoded；litellm.rs / openrouter.rs
      各自维护带 CACHE_VERSION 的磁盘缓存。
    why_this_way: null
    code:
      - file: src-tauri/src/usage/litellm.rs
        symbol: fetch_and_cache
        lines: "112-173"
      - file: src-tauri/src/usage/litellm.rs
        symbol: should_refresh
        lines: "62-78"
      - file: src-tauri/src/usage/openrouter.rs
        lines: "1-234"
      - file: src-tauri/src/usage/pricing_fallback.rs
        lines: "1-153"
    verify:
      command: "TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path src-tauri/Cargo.toml --lib usage::litellm"
      pass: "exit 0"
    future: >
      同样的机制可以用来自动发现"这个模型第一次出现"，进而提示用户新模型上线。

  - id: I-006
    name: "密钥保管：keyring 而非明文"
    status: done
    needs: []
    what: >
      Cursor 的 API key / session token 存进操作系统的凭据库（macOS Keychain、
      Windows Credential Manager、Linux Secret Service），绝不写进 settings.json。
    why: >
      settings.json 是明文、会被同步工具带走、会被贴进 issue。一次泄漏就是别人拿着你的
      key 查你的账。
    expected: >
      settings.json 里永远没有 cursorApiKey 字段；已有的明文 key 在下次启动时被迁移进
      keyring 然后从磁盘抹掉；日志里 key 一律打成 [redacted]。
    how: >
      secrets/ 模块封装 keyring crate（Linux 上还有 0600 权限的文件兜底）；
      settings.ts 的 persistSettings 显式把 cursorApiKey 从写盘对象里解构掉；
      loadSettings 做一次性迁移。
    why_this_way: >
      代码里留了 ponytail 注释说明取舍："keyring is the encryption. Legacy plaintext
      copies in settings.json are migrated once, then stripped. Do not strip on migrate
      failure"；提交 2e9ad32 的标题就是 "stop undercounting spend and leaking the
      Cursor API key"，说明这是修过的真实事故而不是预防性设计。
    code:
      - file: src/lib/stores/settings.ts
        symbol: loadSettings
        lines: "556-575"
      - file: src/lib/stores/settings.ts
        symbol: persistSettings
        lines: "590-601"
      - file: src-tauri/src/secrets/cursor.rs
    verify:
      command: "npx vitest run src/lib/stores/settings.test.ts"
      pass: "exit 0"
    future: >
      以后接入任何需要 token 的供应商都走同一条路，不必再讨论"存哪里"。

