  - id: I-037
    name: "单实例与焦点协议"
    status: done
    needs: []
    what: >
      用一个本地端口做锁，第二次启动时把焦点交给已在运行的实例然后自己退出。
    why: >
      两个实例会争同一个托盘图标、同时写同一份归档、同时装 statusline。用户看到的是
      两个图标和一堆莫名其妙的重复数据。
    expected: >
      重复启动不产生第二个托盘图标，而是弹出已有窗口；持锁进程异常退出后，新进程能在
      几秒的重绑预算内接管；端口被外部进程占用时能报出是谁占的。
    how: >
      single_instance/ 里 try_bind_lock 抢端口，probe_holder 走一个小协议问候持有者，
      Windows 上用 GetExtendedTcpTable 把端口映射回 PID。
    why_this_way: >
      Cargo.toml 里为这个用途单独引入了 Win32_NetworkManagement_IpHelper 并写明理由：
      "Single-instance guard: map the lock port to its owning PID when a foreign
