  - id: I-038
    name: "后台刷新循环与事件广播"
    status: done
    needs: [I-010, I-012, I-014, I-017]
    what: >
      两个后台任务：一个 2 秒的快节奏轮询（盯 statusline 事件），一个按用户设定的间隔
      对齐到整点/午夜的慢循环（重算用量、归档、同步远程、刷新托盘）。
    why: >
      托盘上的数字必须自己会动。而"自己会动"和"持续吃 CPU"之间只隔着一个调度设计。
    expected: >
      tick 落在对齐的整秒上、跨午夜时一定在午夜后 1 秒醒一次（这样日视图会自动翻页）；
      永不返回 0 睡眠；间隔设得比一天还长时仍然每天至少跑一次；数据变化后广播
      data-updated，前端做静默刷新而不是重新加载。
    how: >
      lib.rs 的 fast_statusline_poll + background_loop，睡眠时长由
      secs_until_next_refresh 计算；归档 / SSH 同步 / 去重清理挂在慢循环上。
    why_this_way: >
      secs_until_next_refresh 的单元测试名就是这条设计的规格：
      always_stops_at_one_second_past_midnight、
      first_tick_of_the_day_is_one_second_after_midnight、
      subsecond_drift_is_trimmed_not_accumulated、never_returns_a_zero_sleep。
    code:
      - file: src-tauri/src/lib.rs
        symbol: secs_until_next_refresh
        lines: "619-636"
      - file: src-tauri/src/lib.rs
        symbol: background_loop
        lines: "637-857"
      - file: src-tauri/src/lib.rs
        symbol: fast_statusline_poll
        lines: "526-618"
    verify:
      command: "TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path src-tauri/Cargo.toml --lib always_stops_at_one_second_past_midnight"
      pass: "exit 0"
    future: >
      快慢两档已经在了；下一步可以按窗口是否可见再降一档，进一步压低空闲功耗。

