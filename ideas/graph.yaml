  # ── 发布 ─────────────────────────────────────────────────────

  - id: I-040
    name: "版本号同步与发布脚本"
    status: doing
    needs: []
    what: >
      一条命令把版本号同时改到四个文件、提交、打 tag、推送。
    why: >
      版本号分散在 package.json、Cargo.toml、Cargo.lock、tauri.conf.json 四处。
      漏改任何一处，产出的安装包版本和 updater 清单就对不上，自动更新会永远提示或永远沉默。
    expected: >
      npm run release -- X.Y.Z 之后四个文件版本一致；必须在最新的 main 上才允许运行；
      推 tag 触发发布工作流。
    how: >
      scripts/release.sh 做前置检查与提交打 tag，
      scripts/sync-tauri-versions.mjs 负责把 @tauri-apps/api 与 tauri crate 的 minor
      版本对齐（也是 pretauri 钩子）。
    why_this_way: >
      AGENTS.md 把这条写成了硬性 Gotcha："Version must stay in sync across four files...
      Always use npm run release -- X.Y.Z"，并且明确"Merging to main does NOT release;
      the release workflow is tag-triggered"。
    code:
      - file: scripts/release.sh
        lines: "1-128"
      - file: scripts/sync-tauri-versions.mjs
        lines: "1-32"
    verify:
      manual: "在一个临时分支上跑发布脚本的 dry run，或发布后核对 package.json / Cargo.toml / Cargo.lock / tauri.conf.json 四处版本号一致。"
      signed_off: null
    future: >
      版本一致性也可以变成 CI 的一条断言，让忘记同步在 PR 阶段就红。
    log:
      - date: "2026-08-24"
        by: ccscan
        note: "脚本已在用（0.14.2 就是这么发的），但没有任何自动化断言四文件版本一致，只能人工核对，所以停在 doing 等人签字。"

