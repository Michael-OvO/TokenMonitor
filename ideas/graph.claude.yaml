  - id: I-003
    name: "三家的日志格式归一成同一种用量条目"
    status: done
    needs: []
    what: >
      三家 provider 的原始日志格式完全不同，全部归一到同一个 `ParsedEntry` （时间戳、模型键、原始模型名、输入/输出/两档缓存
      token、web search 次数、 provider、来源、作用域），再由它聚合成 `UsagePayload` 给前端。
    why: >
      如果不归一，定价、聚合、归档、导出、图表每一层都要认三种格式， 任何一层漏掉一种就是静默少算钱。
    expected: >
      定价、归档、导出、设备聚合都只认 `ParsedEntry` / `ArchivedHourly`； 新 provider 只要能产出
      `ParsedEntry` 就自动获得后面所有能力。
    how: >
      `usage/parser.rs` 定义 `ParsedEntry`，`models.rs` 定义面向前端的 `UsagePayload` /
      `ChartBucket` / `ModelSummary` 等 IPC 结构， 前端 `src/lib/types/` 镜像同一批类型。
    why_this_way: >
      作者本人的说法：统一，方便，之后好兼容。也就是说这个字段集不是为了精确描述任何一家 provider
      的日志，而是取三家的并集加上下游（定价/归档/导出/图表）需要的东西—— 宁可让某些 provider 的某些字段恒为 0，也不让下游认三种格式。
      代价是接第四家时字段集可能还要再扩一次，收益是扩的时候只改这一处。
    code:
      - file: src-tauri/src/usage/parser.rs
        symbol: ParsedEntry
        lines: "35-50"
      - file: src-tauri/src/models.rs
        symbol: UsagePayload
        lines: "16-81"
    verify:
      command: TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path
        src-tauri/Cargo.toml --lib claude_unknown_future_family_keeps_identity
      pass: "exit 0"
    future: >
      这个结构是所有"再加一个维度"的落点：按仓库分、按分支分、按人分， 只要 ParsedEntry 多一个字段。

  - id: I-004
    name: "会随外部世界变化的常量集中放进一份 JSON"
    status: done
    needs: []
    what: >
      所有会随外部世界变化的常量——各家 API base、定价表 URL、汇率 URL、缓存 TTL、 Claude 各套餐的月费——放进
      `ops.json`，编译期 include 进二进制， 同一份也给前端读。
    why: >
      套餐涨价、接口换域名、TTL 需要调，这些都不该是"改代码 + 发版"级别的事， 也不该在前后端各写一份然后对不上。
    expected: >
      `ops()` 能读出套餐预算和全部 URL；前端的 plan tier 成本与后端同源（有测试锁定）。
    how: >
      `ops.rs` 用 `include_str!("ops.json")` + `OnceLock` 解析一次； 前端
      `providerMetadata.ts` 直接 import 同一个 JSON 取 `plan_tier_costs_usd`。
      注意：这是**纯编译期** include，没有任何运行时覆盖路径（无 env、无 app_data_dir 同名文件、
      无远端拉取、tauri.conf.json 的 bundle 块也没有 resources），改了必须重新编译发版。
    why_this_way: >
      文档层面的理由写在 `ops.json:2` 的 `_notes` 和 `ops.rs:38`（"`plan_tier_costs_usd` is
      deliberately absent here: the frontend imports it"）——集中一处、前后端同源。
      「为什么不做成运行时可覆盖」这条**代码里没有写明**，但有一个很硬的现实约束： `ops.json` 的 `urls` 里有 5 条会被贴上凭据的
      origin——`anthropic_usage` / `anthropic_account` 走
      `bearer_auth(token)`（`rate_limits/claude.rs:331-341`）， 三条 cursor origin
      分别走 `basic_auth(api_key)` / `Cookie: WorkosCursorSessionToken` /
      `bearer_auth`（`cursor_parser.rs:733-744`、`rate_limits/cursor.rs:245-252`）。
      让用户目录下一个可写 JSON 决定这些地址，等于给本地任意进程一个把 OAuth token 转发到任意主机的开关；而引入 ops.json
      的那次提交标题正是 `fix(usage): stop undercounting spend and leaking the Cursor API
      key`。 （这段安全推理是本次扫描的分析，不是代码或提交信息里的原话。）
    code:
      - file: src-tauri/src/ops.rs
        symbol: ops
        lines: "13-136"
    verify:
      command: TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path
        src-tauri/Cargo.toml --lib
        ops_json_keeps_plan_tier_costs_for_the_frontend
      pass: "exit 0"
    future: >
      如果要做运行时可覆盖，只能限定 `claude_plan_budgets` / `plan_tier_costs_usd` 这类纯数字，`urls`
      永远不参与合并——否则就是上面那个凭据转发洞。 更便宜的一步是给 ops.json 补上 `_sources`（照
      `pricing_fallback.json:3-11` 的形式）， 让每个值的出处可审计。

