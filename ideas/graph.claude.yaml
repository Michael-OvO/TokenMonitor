      webview**：托盘（`commands/tray.rs:169,171`）、悬浮球
      （`floatBallUtils.ts:22-24`）、UsageBars 的额外用量（`UsageBars.svelte:117-124`）、
      Cursor 额度标签（`rate_limits/cursor.rs:52,54`）都写死 `$` 且不换算。 选 EUR 的用户会同时看到托盘
      `$5.00` 和弹窗 `€4.60`。这一条目前不成立，由 I-047 承接。
    how: >
      后端 `exchange_rates.rs` 负责拉取与缓存并把汇率表推给前端， 前端 `format.ts` 的
      `convertCost`/`formatCost` 只在渲染那一刻换算。 持久层刻意不存成本：归档 `ArchivedHourly` 只有
