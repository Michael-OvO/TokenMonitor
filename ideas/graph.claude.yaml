        symbol: updateSetting 的 currency 分支
        lines: "641-649"
    verify:
      manual: "设置里把币种切成 EUR，同时看托盘/菜单栏文字、悬浮球、弹窗顶部总额、 UsageBars 的额外用量四处，确认符号和数值一致；然后删掉
        app_data_dir 下的 exchange-rates-cache.json 冷启动一次，确认没有静默用旧汇率。"
      signed_off: null
