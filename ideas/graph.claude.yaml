  - id: I-046
    name: "设置被静默重置时告诉用户"
    status: todo
    needs: [ I-035 ]
    what: >
      当磁盘上的设置里有值没通过归一化、被换成默认值时，在界面上说一句， 而不是像现在这样悄悄改掉再写回磁盘。
    why: >
      作者本人提的。当前 18 个 `normalize*` 函数没有一个把"我兜底了"这件事传出去： 返回值只有值本身，函数体内零 console、零
      logger、零事件。最疼的几个： 自定义 5h/周预算被判非法就变 `null`，随后回落到套餐默认预算，百分比全算错而界面无任何提示
      （`normalizePositiveNumberOrNull`，`settings.ts:449-453`）； 整份隐藏模型列表不是数组就变
      `[]`，所有模型突然重新出现 （`normalizeHiddenModels`，`settings.ts:220-232`）； 一条 SSH
      host 的 `enabled` 不是 boolean 就整条丢弃、不是补默认值
      （`normalizeSshHosts`，`settings.ts:284-307`）。
      而且原值会被写回磁盘永久消失（`settings.ts:567/574` 的迁移分支、 `updateSetting` 的
      `settings.ts:646`），全仓没有任何备份或撤销通道。 现在唯一的痕迹是
      `console.warn`（`settings.ts:585`），而它只在 `store.get()` 抛异常时触发——JSON
      合法但值全是垃圾的 settings.json 走不到那个 catch。
    expected: >
      启动时若有字段被重置，主窗口出现一条可关闭的提示，写明哪几个字段、原值是什么、
      现在用的是什么；不影响启动，不阻塞任何流程；没有字段被重置时完全不出现。
    how: >
      `settings.ts:502` 是全仓唯一同时持有原始值（`migrated`）和归一化结果（`merged`）的地方， diff
      只能在这一行产生。把 diff 存进 `settings.ts:467` 旁边一个新的 store， 在
      `App.svelte:791`（`<UpdateBanner />` 旁边）按现有形态渲染。 若要支持"恢复原值"，必须在
      `settings.ts:476` 就把原始对象截留下来。
    why_this_way: >
      不新造 toast 系统：仓库里没有通用 toast/notification store，但已有两种现成形态——
      `UpdateBanner.svelte:52-83`（顶部横幅，无 props、由 store 驱动、无超时、点 × 关闭） 和
      `.usage-warning` 内联卡（`App.svelte:851-867`，标题 + 正文 + 动作按钮）。
      后者更合适，因为这条提示需要正文（列出被重置的字段）。 不用
      `logger`：`logger`（`utils/logger.ts:32-54`）只经 IPC 转发给 Rust 落盘， 连 console
      都不打，IPC 失败还被静默吞掉，到不了任何界面。
    code:
      - file: src/lib/stores/settings.ts
        symbol: loadSettings（归一化发生在 :502）
        lines: "471-505"
      - file: src/App.svelte
        symbol: 提示挂载点（UpdateBanner 旁）
        lines: "788-795"
    verify:
      command: npx vitest run src/lib/stores/settings.test.ts
      pass: "exit 0"
    future: >
      同一条通道可以承载"你的设置从 v0.13 迁移过来了""这台机器的 SSH 配置有 2 条读不懂" 这类所有启动期的一次性告知。
    log:
      - date: "2026-08-25"
        by: ccscan
        note: "作者提出：归一化这层应该设计一个提示用户的东西。新建节点。"

  - id: I-047
    name: "让托盘和悬浮球也按用户选的币种显示金额"
    status: todo
    needs: [ I-013, I-030, I-032 ]
    what: >
      把货币换算从"只有主 webview 会做"变成"每一个显示金额的地方都会做"—— 托盘、悬浮球、UsageBars 的额外用量、Cursor
      额度标签。
    why: >
      选了 EUR 的用户现在会在同一时刻看到托盘 `$5.00` 和弹窗 `€4.60`。 托盘是常驻可见面，它显示错误的币种符号直接打击 I-043
      这个终点的"可信"二字。 本次扫描核实到的四处： `commands/tray.rs:169,171`（+ `lib.rs:214` 的
      `$--.--` 占位符）Rust 直接 `format!("${:.2}")`； `floatBallUtils.ts:22-24` 悬浮球写死
      `$`； `UsageBars.svelte:117-124` 用 `Intl.NumberFormat` 写死
      `currency:"USD"`，就在主弹窗里； `rate_limits/cursor.rs:52,54` Rust 生成 `API ($70
      included)` 标签混进已换算的界面。 另有两条相关的：冷启动时汇率缓存不存在则整个会话跑 `format.ts:9-14` 的硬编码历史汇率
      （`bootstrap.ts:91-93` 的守卫会跳过空表）；后台 24h 刷新汇率时不 emit 事件， 长期不重启的会话汇率不更新。
    expected: >
      切到 EUR 后，托盘、悬浮球、弹窗、UsageBars 显示的是同一个数值和同一个符号； 冷启动没有汇率缓存时不静默使用硬编码汇率。
    how: >
      两条路，选一条： (a) 把 currency + rates 塞进 `TrayConfig`（`tray.rs:35-48`，现在没有
      currency 字段， 整个 `src-tauri/src/` grep `currency` 只命中
      `exchange_rates.rs:88` 一个参数名）， 让 Rust 侧统一格式化——`exchange_rates.rs:87-92` 的
      `get_rate` 已经写好了， 而且挂着 `#[cfg_attr(not(test),
      allow(dead_code))]`，说明这条路当初铺了一半就停了；
      `StatusWidgetSummary.title`（`tray.rs:567`）也是现成但没人消费的载体。 (b) 给悬浮球那个独立
      entry（`src/float-ball.ts`，全文不调 `setCurrency`/`setRates`） 单独接一遍 settings +
      rates，托盘那侧仍然只能靠 (a)。 `UsageBars.svelte` 那一处最便宜，`import { formatCost }` 一行。
      **已选 (a)。** 落地形态：新增 `src-tauri/src/usage/money.rs` 作为 Rust 侧唯一的金额格式化处
      （symbol 表 + 换算 + 三种精度：`format` / `format_auto` / `format_compact`），
      新增 `set_currency` IPC 把用户选的币种推给 Rust，
      新增 `exchange-rates-updated` 事件把汇率推回前端；
      托盘、Cursor 额度标签、`StatusWidgetSummary.cost_text` 都改走 money，
      悬浮球渲染 `cost_text`，`UsageBars` 改用前端新增的 `formatCreditAmount`。
    why_this_way: >
      选 (a) 不是因为它更优雅，而是因为 (b) 不完整：悬浮球接上 settings 之后，
      托盘那侧仍然只能靠 (a)——托盘是 Rust 画的，`format.ts` 的模块级变量跨不过 IPC。
      (a) 严格覆盖 (b)，所以没有理由先做半个。
      在 Rust 侧新开一个 `money` 模块而不是把 currency 塞进 `TrayConfig`：
      需要换算的不止托盘——Cursor 的 `API (…included)` 标签在 `rate_limits/cursor.rs`，
      跟托盘配置毫无关系，塞进 `TrayConfig` 会让一个与托盘无关的模块去读托盘配置。
      币种是应用级状态，与汇率表（`exchange_rates.rs` 里已经是进程全局）同级，
      所以它也做成进程全局，`money` 同时持有两者。
      悬浮球走「Rust 把 `cost_text` 算好发过来」而不是「给悬浮球接一遍 settings + rates」：
      它是独立 Vite entry，接 settings 等于把整条 settings 加载链复制到第二个 webview，
      而 `StatusWidgetSummary` 这条 IPC 本来每次刷新都在发，多一个字符串字段的成本接近零。
      格式化规则在 `money.rs` 和 `format.ts` 两边各写一份而不是只留一份：
      两边运行环境不同，无法共享代码；代价是一致性只能靠测试钉住，
      所以两边的测试都显式写明了它镜像的是另一侧。
