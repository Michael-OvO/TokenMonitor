version: 1
agent: claude
project: TokenMonitor
overview: >
  TokenMonitor 是一个本地优先的跨平台托盘应用（Tauri v2 + Svelte 5），把 Claude Code、 Codex CLI 和
  Cursor 三家 AI 编码工具散落在磁盘上的 JSONL 会话日志读出来、定价、聚合，
  然后在托盘弹窗和悬浮球里显示"花了多少钱"和"额度用了百分之多少"。它不代理任何请求、 不上传任何数据，除了拉取公共定价表和三家官方的额度接口之外完全离线。
  三条主线：把数字算准（解析 + 定价 + 缓存）、把历史留住（归档 + 导入导出 + 远端同步）、 把它装到别人机器上（单实例 + 自动更新 +
  最小权限面）。
endpoints: [ I-043, I-044, I-045 ]

ideas:
  # ────────────────────────── 地基 ──────────────────────────
  - id: I-001
    name: "把应用会读的每个磁盘位置登记在同一个模块里"
    status: done
    needs: []
    what: >
      把应用会读的每一个文件系统位置（Claude 项目目录、Codex 会话目录、Cursor 的
      state.vscdb、~/.ssh/config、~/.claude/settings.json、凭据文件）都登记在一个
      模块里，并让它能被枚举出来给用户看。
    why: >
      这是一个"读你本地日志"的应用，用户凭什么信它？如果访问路径散落在十几个解析器里，
      既没人能回答"它到底读了什么"，隐私披露面板也只能靠人肉维护、迟早说谎。
    expected: >
      `accessed_paths()` 返回的列表与设置里"隐私"面板显示的一致；新增一个 provider 时，
      忘记登记路径会在测试里暴露，而不是在用户投诉里暴露。
    how: >
      `paths.rs` 用 `AccessedPath { path, purpose, .. }` 结构统一描述每个位置， 各 provider
      的默认根目录都由这里的函数产出，`accessed_paths()` 汇总成一份可展示的清单。
    why_this_way: >
      AGENTS.md 把它写成硬约定："Every filesystem location the app reads must be
      registered in src-tauri/src/paths.rs"。集中登记是为了让隐私声明可以从代码生成，而不是靠文档追赶代码。
    code:
      - file: src-tauri/src/paths.rs
        symbol: accessed_paths
        lines: "161-229"
      - file: src-tauri/src/paths.rs
        symbol: claude_project_roots_default
        lines: "36-47"
    verify:
      command: TM_EMBED_TEST_MANIFEST=1 cargo test --manifest-path
        src-tauri/Cargo.toml --lib
        accessed_paths_includes_claude_and_codex_and_ssh
      pass: "exit 0"
    future: >
      任何"这个应用碰了什么"的问题都能机器回答：审计导出、企业分发时的合规清单、 甚至可以做成"这些目录我不允许你读"的开关。

  - id: I-002
    name: "每个 provider 的界面差异只在一个文件里定义"
    status: done
    needs: [ I-001 ]
    what: >
      每个 provider（claude / codex / cursor）的 UI 与行为参数——标签、品牌色、logo、 是否有额度表、主窗口
      id、最小拉取间隔、过期宽限、套餐价——集中定义一次， 前端所有地方从这里查，而不是各自写 if provider === "claude"。
    why: >
      三家 provider 的差异是这个项目最大的复杂度来源。散开写的话，加一家 provider 要改 二十个文件，改漏一个就是"Cursor 的
      tab 有颜色但图表没有"这种半残 bug。
    expected: >
